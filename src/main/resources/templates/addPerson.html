<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Ajouter une personne</title>
    <link rel="stylesheet" href="../static/css/style.css"
          th:href="@{/css/style.css}" />
</head>
<body>
<h1>Créer une personne</h1>
<form th:action="@{/addPerson}" th:object="${personForm}" method="post">
    <label for="firstName">Prénom :</label>
    <input type="text" th:field="*{firstName}" />
    <span class="error" th:if="${#fields.hasErrors('firstName')}"
          th:errors="*{firstName}">Erreur</span>
    <br/>
    <label for="lastName">Nom :</label>
    <input type="text" th:field="*{lastName}" />
    <span class="error" th:if="${#fields.hasErrors('lastName')}"
          th:errors="*{lastName}">Erreur</span>
    <br/>
    <input type="submit" value="Créer" />
</form>
<p><a th:href="@{/personList}">Retour à la liste</a></p>
</body>
</html>
